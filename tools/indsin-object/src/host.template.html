  Input (any of):
    IndsinObject.applyFrame(json | object)          engine envelope {"ok":true,"fabric":{...}} or a logical tree
    postMessage({ indsin: 'frame', payload })       from the embedding page / native host (parent / opener only)
    IndsinObject.attachWasm(Module, session)        live engine session through Emscripten
    ?frame=<url-encoded JSON>                       one-shot, for quick previews
  Output / events:
    IndsinAndroid.onEvent(json) · webkit.messageHandlers.indsin · IndsinHost.onEvent(json) ·
    ReactNativeWebView.postMessage · chrome.webview.postMessage · parent.postMessage · window event 'indsin:event'
    { type: 'tap|longpress|doubletap|hoverenter|hoverexit|change|select|close|remove|page|error', id, path, kind, value?, x?, y?, onTap?, url? }
  URL parameters:
    ?theme=dark|light|auto|<ThemeName>   ?dir=ltr|rtl|auto   ?lang=ar   ?demo=0 (disable the self-gallery)   ?animations=0
-->
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#0e0e12}
  body{-webkit-text-size-adjust:100%}
  #app{min-height:100vh}
</style>
</head>
<body>
<div id="app"></div>

<script>
/*__CORE__*/
</script>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var opts = {
    theme: q.get('theme') || 'dark',
    dir: q.get('dir') || (q.get('rtl') === '1' ? 'rtl' : 'auto'),
    lang: q.get('lang') || '',
    animations: q.get('animations') !== '0'
  };
  var view = IndsinObject.mount('#app', null, opts);

  // Keep the page background in sync with the active theme (also on the overscroll area).
  addEventListener('indsin:rendered', function () {
    var r = document.querySelector('.ix-root');
    if (r) document.body.style.background = getComputedStyle(r).backgroundColor;
  });

  // Compatibility facade: the global object drives the default view.
  ['render', 'applyFrame', 'setTheme', 'configure', 'attachWasm', 'attachSession', 'detach', 'setOpen', 'on', 'destroy', 'issues']
    .forEach(function (m) { IndsinObject[m] = view[m]; });
  IndsinObject.view = view;
  IndsinObject.toHtmlCurrent = view.toHtml;

  var nativeHost = !!(window.IndsinAndroid || window.IndsinHost || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.indsin) ||
    window.ReactNativeWebView || (window.chrome && window.chrome.webview));
  var frame = q.get('frame'), rendered = false;
  addEventListener('indsin:rendered', function () { rendered = true; });
  if (frame) { view.render(frame); }
  else if (q.get('demo') !== '0') {
    setTimeout(function () {
      if (!rendered && !nativeHost && parent === window) {
        var s = IndsinObject.sample();
        view.render(s);
      }
    }, 400);
  }
})();
</script>
</body>
</html>
