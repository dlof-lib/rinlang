name: Build WGOM APK

on:
  push:
    branches: [ main ]
    paths:
      - 'wgom/**'
      - '.github/workflows/build-wgom-apk.yml'
  pull_request:
    paths:
      - 'wgom/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wgom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wgom-debug-apk
          path: wgom/app/build/outputs/apk/debug/*.apk
