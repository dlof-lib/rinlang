name: Windows CLI

# يبني rin.exe (المفسِّر كسطر أوامر) على windows-latest عند أي تعديل يمسّ
# محرّك اللغة نفسه أو مجلد الـCLI، ويرفعه كـ Artifact جاهز للتنزيل — بحيث لا
# يحتاج مستخدمو ويندوز لتثبيت أي مترجم لتجربة rin.exe.

on:
  push:
    branches: [ main ]
    paths:
      - 'cli/windows/**'
      - 'app/src/main/cpp/rin_lexer.*'
      - 'app/src/main/cpp/rin_parser.*'
      - 'app/src/main/cpp/rin_interpreter.*'
      - 'app/src/main/cpp/rin_ast.h'
      - 'app/src/main/cpp/rin_common.h'
      - 'app/src/main/cpp/rin_stdlib_libs.h'
      - '.github/workflows/windows-cli.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake)
        run: cmake -B cli/windows/build -S cli/windows

      - name: Build (Release)
        run: cmake --build cli/windows/build --config Release

      - name: Collect rin.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path cli/windows/build -Recurse -Filter rin.exe | Select-Object -First 1
          if (-not $exe) { throw "rin.exe not found after build" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName -Destination dist/rin.exe
          Copy-Item cli/windows/README.md -Destination dist/README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rin-windows-x64
          path: dist/
