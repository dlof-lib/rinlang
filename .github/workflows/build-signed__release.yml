name: Build Signed Release APK (Rin Lang)

# نسخة احترافية من بناء الـ APK: تُنتج ملف release *موقَّعاً* رقمياً (لا debug)، باستخدام مفتاح
# توقيع حقيقي مخزَّن في GitHub Secrets (وليس مولَّداً تلقائياً أو محفوظاً داخل المستودع).
#
# الأسرار المطلوبة في Settings ← Secrets and variables ← Actions:
#   - ANDROID_KEYSTORE_BASE64  → محتوى ملف الـ keystore (.jks/.keystore) بترميز Base64
#                                 (أنشئه بالأمر: base64 -w0 release.keystore)
#   - KEYSTORE_PASSWORD        → كلمة مرور الـ keystore
#   - KEY_ALIAS                → اسم الـ alias للمفتاح داخل الـ keystore
#   - KEY_PASSWORD             → كلمة مرور المفتاح نفسه
#
# طريقة الاستخدام:
#   1) تأكّد من وجود الأسرار الأربعة أعلاه في المستودع (Settings ← Secrets and variables ← Actions).
#   2) شغّل "Build Signed Release APK (Rin Lang)" (أو انتظر push تلقائياً على main/master).
#   3) بعد الاكتمال: Artifacts ← نزّل "rin-lang-release-apk" وهو APK الموقَّع جاهزاً للتثبيت.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      package_name:
        description: "الاسم الظاهر لملف الـ APK الناتج (بدون .apk)"
        required: false
        default: "RinLang-release"

jobs:
  build-signed-release:
    name: Build & sign release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android v4 defaults to the obsolete `tools` package; install only
          # command-line tools here and let sdkmanager install the exact build deps below.
          packages: ''

      - name: Install NDK & CMake
        run: |
          set -e
          sdkmanager --install "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Verify Gradle/AGP toolchain
        run: gradle --version

      - name: Grant execute permission (if wrapper is present)
        run: chmod +x ./gradlew || true

      # يفك ترميز الـ keystore المخزَّن كسرّ Base64 (ANDROID_KEYSTORE_BASE64) إلى ملف مؤقت،
      # ويصدِّر بيانات التوقيع كمتغيرات بيئة لخطوة البناء. لا شيء من هذا يُكتب أو يُحفَظ
      # داخل المستودع — الأسرار تبقى في GitHub Secrets فقط.
      - name: Decode signing keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing/release.keystore
          {
            echo "RIN_KEYSTORE_PATH=$(pwd)/signing/release.keystore"
            echo "RIN_KEY_ALIAS=$KEY_ALIAS"
            echo "RIN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RIN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename output APK
        id: rename
        run: |
          name="${{ github.event.inputs.package_name }}"
          if [ -z "$name" ]; then name="RinLang-release"; fi
          src=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n1)
          if [ -z "$src" ]; then
            echo "لم يُعثر على APK ناتج — راجع سجلّ خطوة البناء أعلاه."
            exit 1
          fi
          dest="app/build/outputs/apk/release/${name}.apk"
          mv "$src" "$dest"
          echo "apk_path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rin-lang-release-apk
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error

