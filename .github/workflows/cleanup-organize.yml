name: ترتيب الملفات والمجلدات (Reorganize Only)

on:
  workflow_dispatch:
    inputs:
      update_gitignore:
        description: 'تحديث .gitignore أيضاً؟'
        type: boolean
        default: true
      dry_run:
        description: 'تجربة فقط بدون commit/push (عرض ما سيحدث)'
        type: boolean
        default: true

jobs:
  reorganize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------------------------
      # إعادة ترتيب الملفات في مجلدات منطقية
      # ---------------------------------------------------------------
      - name: Reorganize files and folders
        run: |
          set -e
          # دالة نقل آمنة (idempotent): إذا كانت الوجهة موجودة مسبقاً،
          # تحذف نسخة المصدر القديمة بدل أن تفشل بخطأ "destination exists"
          safe_move() {
            src="$1"; dst="$2"
            if [ -e "$dst" ]; then
              echo "   (موجود مسبقاً، حذف النسخة القديمة من: $src)"
              git rm -f -q "$src"
            else
              git mv "$src" "$dst"
            fi
          }

          echo "==> نقل ملفات اختبارات tools/test_*.cpp إلى tests/tools/"
          mkdir -p tests/tools
          shopt -s nullglob 2>/dev/null || true
          for f in tools/test_*.cpp; do
            [ -e "$f" ] && safe_move "$f" "tests/tools/$(basename "$f")"
          done

          echo "==> نقل samples/ إلى examples/samples/"
          if [ -d "samples" ]; then
            mkdir -p examples/samples
            for f in samples/*; do
              safe_move "$f" "examples/samples/$(basename "$f")"
            done
            rmdir samples 2>/dev/null || true
          fi

          echo "==> نقل verification/ إلى tests/verification/"
          if [ -d "verification" ]; then
            mkdir -p tests/verification
            for f in verification/*; do
              safe_move "$f" "tests/verification/$(basename "$f")"
            done
            rmdir verification 2>/dev/null || true
          fi

      # ---------------------------------------------------------------
      # تحديث .gitignore (اختياري)
      # ---------------------------------------------------------------
      - name: Update .gitignore
        if: ${{ inputs.update_gitignore == true }}
        run: |
          touch .gitignore
          for pattern in "signing/" "build-artifact/" "*.keystore" "keystore-credentials.txt" "*.o" "*.obj" "__pycache__/" ".DS_Store"; do
            grep -qxF "$pattern" .gitignore || echo "$pattern" >> .gitignore
          done
          git add .gitignore

      - name: Show pending changes
        run: |
          git status
          git diff --cached --stat || true

      - name: Commit & push changes
        if: ${{ inputs.dry_run == false }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: إعادة ترتيب الملفات والمجلدات"
            git push
          else
            echo "لا توجد تغييرات لعمل commit لها."
          fi
