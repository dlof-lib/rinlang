name: macOS CLI

# يبني rin (المفسِّر كسطر أوامر) على macos-latest عند أي تعديل يمسّ محرّك
# اللغة نفسه أو مجلد الـCLI، ويرفعه كـ Artifact جاهز للتنزيل.

on:
  push:
    branches: [ main ]
    paths:
      - 'cli/macos/**'
      - 'app/src/main/cpp/rin_lexer.*'
      - 'app/src/main/cpp/rin_parser.*'
      - 'app/src/main/cpp/rin_interpreter.*'
      - 'app/src/main/cpp/rin_ast.h'
      - 'app/src/main/cpp/rin_common.h'
      - 'app/src/main/cpp/rin_stdlib_libs.h'
      - '.github/workflows/macos-cli.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, universal2)
        run: |
          cmake -B cli/macos/build -S cli/macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build cli/macos/build -- -j"$(sysctl -n hw.ncpu)"

      - name: Collect rin
        run: |
          mkdir -p dist
          cp cli/macos/build/rin dist/rin
          cp cli/macos/README.md dist/README.md
          chmod +x dist/rin
          file dist/rin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rin-macos-universal
          path: dist/
