name: Build Rin site (native check + WASM) & Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "site.rin"
      - "web/**"
      - "app/src/main/cpp/rin_lexer.*"
      - "app/src/main/cpp/rin_parser.*"
      - "app/src/main/cpp/rin_interpreter.*"
      - "app/src/main/cpp/rin_http.*"
      - "app/src/main/cpp/rin_c_api.*"
      - "app/src/main/cpp/loom/**"
      - "tools/rin_run.cpp"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1) فحص سلامة سريع بأداة loomc الأصلية (نفس محرّك Loomtime، مبني
      #    أصلاً على جهاز التطوير — انظر CMakeLists.txt). هذا لا يُنشر —
      #    غايته فقط إيقاف الـ workflow مبكراً بخطأ واضح إن كان site.rin
      #    نفسه فيه خطأ لغوي أو لا يحتوي جذر @view.<Kind>=name، قبل إضاعة
      #    وقت في بناء WASM لصفحة مكسورة.
      #    (سابقاً كان هذا يشغّل site.rin بالمفسّر العادي ويتحقق من
      #    dist/index.html عبر writeFile — لم يعد ذلك المسار موجوداً بعد أن
      #    أصبحت الصفحة شجرة @view حقيقية بدل مولّد HTML.)
      # ------------------------------------------------------------------
      - name: Sanity-check site.rin as a @view program with loomc
        run: |
          # نفس قائمة مصادر هدف loomc في app/src/main/cpp/CMakeLists.txt بالضبط — لازمة كاملة
          # لأن loom/loomc.cpp يتضمّن rin_loom_pipeline.h الذي يشغّل rin::Interpreter حقيقياً
          # (runColdPipelineWithRuntime)، وليس مجرّد lex+parse فقط؛ بدون rin_interpreter.cpp وكل ما
          # يعتمد عليه (diagnostics/, loader_ui/, clc/) يفشل الربط بأخطاء "undefined reference".
          g++ -O2 -std=c++17 -o loomc_native_check \
            app/src/main/cpp/loom/loomc.cpp \
            app/src/main/cpp/rin_lexer.cpp \
            app/src/main/cpp/rin_parser.cpp \
            app/src/main/cpp/rin_make.cpp \
            app/src/main/cpp/rin_interpreter.cpp \
            app/src/main/cpp/loader_ui/library_loader_ui.cpp \
            app/src/main/cpp/rin_http.cpp \
            app/src/main/cpp/diagnostics/diagnostic.cpp \
            app/src/main/cpp/diagnostics/source_manager.cpp \
            app/src/main/cpp/diagnostics/diagnostic_engine.cpp \
            app/src/main/cpp/diagnostics/diagnostic_renderer.cpp \
            app/src/main/cpp/clc/clc_container.cpp \
            app/src/main/cpp/clc/clc_compress.cpp \
            app/src/main/cpp/clc/clc_security.cpp \
            app/src/main/cpp/clc/clc_rin_opt.cpp \
            app/src/main/cpp/clc/clc_zip_import.cpp \
            app/src/main/cpp/clc/sha256.cpp \
            -I app/src/main/cpp \
            -lz
          ./loomc_native_check site.rin 420 /tmp/site_check.ppm
          echo "Native @view/Loom check OK."
          rm -f loomc_native_check /tmp/site_check.ppm

      # ------------------------------------------------------------------
      # 2) البناء الحقيقي الذي يُنشر: المفسّر الرسمي + محرّك Loomtime (نفس
      #    ملفات lexer/parser/interpreter/loom بلا أي تعديل) مُصرَّف إلى
      #    WebAssembly، ليُنفَّذ site.rin فعلياً (كشجرة @view) داخل متصفح
      #    الزائر نفسه عبر rin_loom_session_*.
      # ------------------------------------------------------------------
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Compile the official Rin engine (incl. Loomtime) to WebAssembly
        run: |
          mkdir -p dist
          # القائمة الكاملة لما يحتاجه rin_interpreter.cpp فعلياً عند الربط (linker) —
          # مطابقة تماماً لهدف rinengine في app/src/main/cpp/CMakeLists.txt، فقط مع
          # استبدال rin_http.cpp (fork/exec لـ curl، غير ممكن داخل WASM) بالبديل
          # web/rin_http_wasm_stub.cpp، وrin_run.cpp/loomc.cpp بجسر WASM المخصص
          # web/rin_wasm_bridge.cpp + loom/rin_loom_c_api.cpp. بدون rin_make.cpp أو
          # diagnostics/ أو loader_ui/ أو clc/ يفشل الربط بأخطاء "undefined symbol"
          # (nearestMatches، validateMakeUnit، validateContainerPolicy، ...).
          em++ -O2 -std=c++17 -fexceptions \
            -I app/src/main/cpp \
            app/src/main/cpp/rin_lexer.cpp \
            app/src/main/cpp/rin_parser.cpp \
            app/src/main/cpp/rin_make.cpp \
            app/src/main/cpp/rin_interpreter.cpp \
            app/src/main/cpp/rin_c_api.cpp \
            app/src/main/cpp/loom/rin_loom_c_api.cpp \
            app/src/main/cpp/loader_ui/library_loader_ui.cpp \
            app/src/main/cpp/diagnostics/diagnostic.cpp \
            app/src/main/cpp/diagnostics/source_manager.cpp \
            app/src/main/cpp/diagnostics/diagnostic_engine.cpp \
            app/src/main/cpp/diagnostics/diagnostic_renderer.cpp \
            app/src/main/cpp/clc/clc_container.cpp \
            app/src/main/cpp/clc/clc_compress.cpp \
            app/src/main/cpp/clc/clc_security.cpp \
            app/src/main/cpp/clc/clc_rin_opt.cpp \
            app/src/main/cpp/clc/clc_zip_import.cpp \
            app/src/main/cpp/clc/sha256.cpp \
            web/rin_http_wasm_stub.cpp \
            web/rin_wasm_bridge.cpp \
            -s MODULARIZE=1 \
            -s EXPORT_NAME=RinModule \
            -s EXPORTED_RUNTIME_METHODS='["ccall","FS"]' \
            -s EXPORTED_FUNCTIONS='["_rin_run_source","_rin_loom_session_create","_rin_loom_session_render_json","_rin_loom_session_tap","_rin_loom_session_update_source","_rin_loom_session_free","_rin_free_string","_malloc","_free"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s STACK_SIZE=8388608 \
            -s DISABLE_EXCEPTION_CATCHING=0 \
            -s ENVIRONMENT=web \
            -s USE_ZLIB=1 \
            -o dist/rin.js

      - name: Assemble the Pages bundle
        run: |
          # site.rin يُنسخ كما هو حرفياً — هو المصدر الوحيد لمحتوى الصفحة (شجرة @view).
          cp site.rin dist/site.rin
          # المحمّل العام (bootloader) الذي يشغّل rin.wasm ويرسم أي Fabric يُعيده.
          cp web/index.html dist/index.html

      - name: Verify bundle
        run: |
          test -f dist/index.html
          test -f dist/site.rin
          test -f dist/rin.wasm
          test -f dist/rin.js
          echo "Bundle contents:"
          ls -la dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
