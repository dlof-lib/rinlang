name: Build Rin Lang APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android v4 defaults to the obsolete `tools` package; install only
          # command-line tools here and let sdkmanager install the exact build deps below.
          packages: ''

      - name: Install NDK & CMake
        run: |
          set -e
          sdkmanager --install "platform-tools" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle/AGP toolchain
        run: gradle --version

      - name: Grant execute permission (if wrapper is present)
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rin-lang-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
