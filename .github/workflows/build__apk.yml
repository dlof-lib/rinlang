# بناء APK موقَّع. التوقيع من GitHub Secrets: ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD. لا يُحفَظ أي مفتاح أو كلمة مرور داخل المستودع.
# بدون الأسرار يُولَّد مفتاح مؤقت لكل تشغيل (لا يصلح لتحديث تطبيق مثبَّت).

name: Build Signed Release APK (Rin Lang - Auto Signing)

# نسخة احترافية من بناء الـ APK: تُنتج ملف release *موقَّعاً* رقمياً (لا debug)، وتُولِّد أسرار
# التوقيع (keystore + كلمتا مرور) بنفسها تلقائياً — لا حاجة لإضافة أي GitHub Secret يدوياً مسبقاً.
#
# **مفتاح توقيع واحد دائم، يُولَّد مرّة واحدة فقط في تاريخ المستودع كله:**
# أول تشغيل يُولِّد ملفَي signing/release.keystore و signing/keystore-credentials.txt، ثم يحفظهما
# بـ commit مباشر على نفس الفرع (main/master) — بلا أي فرع Git إضافي. كل تشغيل تالٍ يجدهما موجودَين
# أصلاً ضمن الملفات التي يسحبها actions/checkout، فيستخدمهما كما هما فوراً دون توليد شيء جديد.
# الـ commit يحمل وسم [skip ci] حتى لا يُشغِّل نفسه من جديد عند الدفع.
#
# ⚠️ تنبيه أمني مهم: ملف keystore-credentials.txt يُحفَظ داخل المستودع نفسه بنص صريح. أي شخص
# يملك صلاحية قراءة على هذا المستودع (git clone/fetch) يرى كلمتَي المرور ويقدر يوقّع بنفس
# المفتاح. هذا مقبول تماماً لمستودع خاص (Private) — وهو الوضع الموصى به بشدة هنا — أمّا لو كان
# المستودع عاماً (Public) فتوقيع تطبيقك يصبح قابلاً للانتحال من أي أحد يطّلع على الكود. لو
# مستودعك عام، إمّا حوّله خاصاً، أو استخدم مفتاح توقيع حقيقي عبر GitHub Secrets يدوياً بدل هذا.
#
# طريقة الاستخدام:
#   1) ارفع المستودع (بما فيه هذا الملف) إلى GitHub، ويُفضَّل أن يكون Private (راجع التنبيه فوق).
#   2) Settings ← Actions ← General ← Workflow permissions ← اختر "Read and write permissions"
#      (مطلوبة مرّة واحدة فقط حتى يقدر الـ workflow يحفظ ملفَي التوقيع في أول تشغيل).
#   3) شغّل "Build Signed Release APK (Rin Lang)" (أو انتظر push تلقائياً على main/master).
#   4) بعد الاكتمال: Artifacts ← نزّل "rin-lang-release-apk" وهو APK الموقَّع جاهزاً للتثبيت.
#      ملفَا التوقيع نفسهما يبقيان محفوظين ضمن المستودع تحت مجلد signing/ للاستخدام الدائم.

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      package_name:
        description: "الاسم الظاهر لملف الـ APK الناتج (بدون .apk)"
        required: false
        default: "RinLang-release"

permissions:
  contents: read

jobs:
  build-signed-release:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    # يمنع تشغيل الـ workflow على الـ commit الذي يحفظ ملفَي التوقيع نفسه (رغم وجود [skip ci]
    # كطبقة حماية أولى، هذا الشرط طبقة إضافية تمنع أي حلقة تكرار غير متوقّعة).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # يحذف بقايا ملفات Loom القديمة (تسبّب فشل aapt2: resource loom_* not found)
      # حتى لو رُفع المشروع كـ ZIP فوق نسخة قديمة. آمن للتكرار.
      - name: Remove legacy Loom files
        run: bash .github/scripts/delete_loom.sh apply

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android v4 defaults to the obsolete `tools` package; install only
          # command-line tools here and let sdkmanager install the exact build deps below.
          packages: ''

      - name: Install NDK & CMake
        run: |
          set -e
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Verify Gradle/AGP toolchain
        run: gradle --version

      - name: Grant execute permission (if wrapper is present)
        run: chmod +x ./gradlew || true

      # التوقيع من GitHub Secrets فقط — لا يُحفَظ أي مفتاح أو كلمة مرور داخل المستودع.
      # بدون الأسرار يُولَّد مفتاح مؤقت لهذا التشغيل (لا يصلح للتحديث فوق إصدار سابق).
      - name: Prepare signing key (from secrets, never committed)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$ks"
            store_pass="$KS_PASS"; key_pass="${KS_KEYPASS:-$KS_PASS}"; key_alias="$KS_ALIAS"
          else
            echo "::warning::أسرار التوقيع غير مضبوطة — سيُولَّد مفتاح مؤقت لهذا التشغيل فقط."
            store_pass="$(openssl rand -hex 24)"; key_pass="$store_pass"; key_alias="rinlang"
            keytool -genkeypair -keystore "$ks" -alias "$key_alias" \
              -keyalg RSA -keysize 4096 -validity 3650 \
              -storepass "$store_pass" -keypass "$key_pass" \
              -dname "CN=RinLang, OU=RinLang App, O=DLoF, C=SA" > /dev/null 2>&1
          fi
          echo "::add-mask::$store_pass"
          echo "::add-mask::$key_pass"
          {
            echo "RIN_KEYSTORE_PATH=$ks"
            echo "RIN_KEY_ALIAS=$key_alias"
            echo "RIN_KEYSTORE_PASSWORD=$store_pass"
            echo "RIN_KEY_PASSWORD=$key_pass"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename output APK
        id: rename
        env:
          PKG_NAME: ${{ github.event.inputs.package_name }}
        run: |
          name="$PKG_NAME"
          if [ -z "$name" ]; then name="RinLang-release"; fi
          src=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n1)
          if [ -z "$src" ]; then
            echo "لم يُعثر على APK ناتج — راجع سجلّ خطوة البناء أعلاه."
            exit 1
          fi
          dest="app/build/outputs/apk/release/${name}.apk"
          mv "$src" "$dest"
          echo "apk_path=$dest" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rin-lang-release-apk
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error
