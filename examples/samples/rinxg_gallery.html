<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معرض RinXG</title>
<style>
:root{--rinxg-bg:#f5f5f5;--rinxg-font:sans-serif;}
*{box-sizing:border-box;}
body{background:var(--rinxg-bg,#ffffff);font-family:var(--rinxg-font,sans-serif);margin:0;padding:24px;}
.rinxg-btn{text-decoration:none;}
.rinxg-btn:hover{filter:brightness(1.1);}
.rinxg-btn:active{transform:translateY(1px);filter:brightness(0.95);}
.rinxg-btn:focus-visible{outline:2px solid #7c5cff;outline-offset:2px;}
.rinxg-btn[disabled]{filter:grayscale(.3);}
</style>
</head>
<body>
<div class="rinxg-container" style="display:flex;flex-direction:column;gap:16px;padding:24px;"><h1 style="color:#222;">مرحباً بلغة RinXG</h1>
<p style="color:#666;">صمِّم واجهات ويب كاملة بصيغة تصريحية بسيطة</p>
<div class="rinxg-container" style="display:flex;flex-direction:row;gap:8px;"><button class="rinxg-btn" style="display:inline-block;border:2px solid transparent;cursor:pointer;font-weight:600;font-size:15px;padding:10px 22px;color:#ffffff;transition:filter .15s ease, transform .05s ease;background:#4CAF50;border-color:#4CAF50;border-radius:8px;">ابدأ الآن</button>
<button class="rinxg-btn" style="display:inline-block;border:2px solid transparent;cursor:pointer;font-weight:600;font-size:15px;padding:10px 22px;color:#4CAF50;transition:filter .15s ease, transform .05s ease;background:#ffffff;border-color:#ffffff;border-radius:8px;">تعلّم المزيد</button>
</div>
<input type="text" placeholder="بريدك الإلكتروني..." style="padding:8px;border:1px solid #ccc;border-radius:6px;">
<a href="https://example.com">زيارة الموقع</a>
<ul>
<li>سريعة: مكتوبة بالكامل بـ Rin</li>
<li>تُصيَّر إلى HTML+CSS حقيقي</li>
<li>جاهزة للعرض في أي متصفّح</li>
</ul>
</div>
</body>
</html>
