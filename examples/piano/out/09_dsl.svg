<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" font-family="Inter, 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif">
  <title>Poster</title>
  <defs>
    <linearGradient id="pn1" x1="0.25" y1="0.07" x2="0.75" y2="0.93">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pn2" x1="0.15" y1="0.15" x2="0.85" y2="0.85">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="pn3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020"/>
  <rect class="Bg" x="0" y="0" width="480" height="270" fill="url(#pn1)"/>
  <g class="Hero" filter="url(#pn3)">
    <circle class="Disc" cx="240" cy="128" r="74" fill="url(#pn2)"/>
    <text class="Name" x="240" y="138" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff">piano</text>
  </g>
  <circle cx="40" cy="232" r="4" fill="#818cf8"/>
  <circle cx="106" cy="232" r="5" fill="#22d3ee"/>
  <circle cx="172" cy="232" r="6" fill="#fbbf24"/>
  <circle cx="238" cy="232" r="7" fill="#f87171"/>
  <circle cx="304" cy="232" r="4" fill="#818cf8"/>
  <circle cx="370" cy="232" r="5" fill="#22d3ee"/>
  <circle cx="436" cy="232" r="6" fill="#fbbf24"/>
  <g class="Tag">
    <rect x="168.12" y="23.5" width="143.76" height="25" rx="12.5" fill="#1db143"/>
    <text x="240" y="40.55" font-size="13" font-weight="600" text-anchor="middle" fill="#000000">لغة الكتل</text>
  </g>
</svg>
