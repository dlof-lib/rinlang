<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270" font-family="Inter, 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif">
  <title>مرحباً piano</title>
  <defs>
    <linearGradient id="pn1" x1="0.25" y1="0.07" x2="0.75" y2="0.93">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pn2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="pn3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="pn4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="pn5" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020"/>
  <rect x="0" y="0" width="480" height="270" fill="url(#pn1)"/>
  <circle cx="380" cy="60" r="90" fill="url(#pn2)" opacity="0.35" filter="url(#pn3)"/>
  <rect x="40" y="60" width="400" height="150" rx="20" fill="#ffffff" fill-opacity="0.078" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" filter="url(#pn4)"/>
  <text x="240" y="130" font-size="54" font-weight="800" text-anchor="middle" fill="url(#pn5)">piano</text>
  <text x="240" y="170" font-size="18" text-anchor="middle" direction="rtl" fill="#a5b4fc">مكتبة رسم احترافية بلغة Rin</text>
  <g>
    <rect x="142.64" y="219.5" width="194.72" height="25" rx="12.5" fill="#1db143"/>
    <text x="240" y="236.55" font-size="13" font-weight="600" text-anchor="middle" fill="#000000">SVG · JSON · C++ · JS</text>
  </g>
</svg>
