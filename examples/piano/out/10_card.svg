<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" font-family="Inter, 'Segoe UI', Tahoma, 'Noto Sans Arabic', Arial, sans-serif">
  <title>Card</title>
  <defs>
    <filter id="pn1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="6" result="o"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="pn2" x1="0.15" y1="0.15" x2="0.85" y2="0.85">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#3b35ac"/>
    </linearGradient>
    <linearGradient id="pn3" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect class="Bg" x="10" y="10" width="300" height="160" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5" filter="url(#pn1)"/>
  <g class="Av">
    <circle cx="56" cy="62" r="26" fill="url(#pn2)"/>
    <text x="56" y="69.8" font-size="22.1" font-weight="700" text-anchor="middle" fill="#FFFFFF">سر</text>
  </g>
  <text class="Name" x="96" y="58" font-size="17" font-weight="800" fill="#111827">سارة المنصور</text>
  <text class="Role" x="96" y="78" font-size="12" fill="#6b7280">مصمّمة واجهات</text>
  <g class="Tag">
    <rect x="225.12" y="24" width="73.76" height="24" rx="12" fill="#10b981" fill-opacity="0.161"/>
    <text x="262" y="40.2" font-size="12" font-weight="600" text-anchor="middle" fill="#10b981">نشطة</text>
  </g>
  <g class="Bar">
    <rect x="28" y="112" width="264" height="8" rx="4" fill="#e5e7eb"/>
    <rect x="28" y="112" width="190.08" height="8" rx="4" fill="url(#pn3)"/>
  </g>
  <text class="Cap" x="28" y="140" font-size="12" fill="#6b7280">اكتمال الملف: ٧٢٪</text>
  <g class="Btn">
    <rect x="216" y="138" width="84" height="24" rx="8" fill="#4f46e5"/>
    <text x="258" y="154.2" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">متابعة</text>
  </g>
</svg>
