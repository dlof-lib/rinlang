name: Build RinStudio Auth APK

on:
  push:
    branches: [ main ]
    paths:
      - 'rinstudio-auth/**'
      - '.github/workflows/build-rinstudio-auth-apk.yml'
  pull_request:
    paths:
      - 'rinstudio-auth/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rinstudio-auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json يُعاد إنشاؤه من سرّ GitHub بدل تخزينه في المستودع.
      # أنشئ السرّ RINSTUDIO_GOOGLE_SERVICES_JSON من إعدادات المستودع (Settings -> Secrets
      # and variables -> Actions) وضع فيه محتوى الملف الحقيقي بالكامل (Base64 أو نص عادي).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.RINSTUDIO_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "تحذير: السرّ RINSTUDIO_GOOGLE_SERVICES_JSON غير مضبوط — استخدام الملف الموجود في المستودع (إن وُجد) كقيمة تجريبية فقط."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rinstudio-auth-debug-apk
          path: rinstudio-auth/app/build/outputs/apk/debug/*.apk
