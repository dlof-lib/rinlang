<!DOCTYPE html>
<!--
  هذا الملف "محمّل" (bootloader) عام بحت — لا عنوان، لا نص، لا قسم، لا لون خاص
  بصفحة Rin نفسها مكتوب هنا. دوره الوحيد: تحميل محرّك Rin/Indsintime الرسمي
  المُصرَّف WebAssembly، تمرير site.rin إليه كنص خام عبر rin_indsin_session_create()،
  ثم رسم أي شجرة Strand (JSON: kind/name/attrs/geometry/children) يُعيدها ذلك
  المحرّك عبر دالة عرض عامة واحدة (renderStrand) — تلك الدالة تربط "نوع Strand"
  بعنصر DOM ("Column" -> flex عمودي، "Card" -> صندوق، "Text" -> نص...) ولا تعرف
  شيئاً عن محتوى *هذه* الصفحة تحديداً؛ هي نفس ما يفعله بالضبط
  tools/mirror-indsin-preview/*.html كمرجع لنفس المحرّك (Fabric نفسها، JSON نفسه).

  المصدر الحقيقي الوحيد لكل كلمة/لون/سلوك في الصفحة هو site.rin. المتصفح لا
  يفهم إلا HTML/JS/WASM (بنية تشغيل لازمة تقنياً، تماماً كنظام تشغيل يشغّل ملفاً
  تنفيذياً) — لكنها لا "تكتب" أي جزء من محتوى الصفحة نفسه.
-->

<style>
  /* ---- تنسيق عام للمحمِّل ومسرح الرسم فقط — لا شيء منه خاص بمحتوى site.rin ---- */
  html,body{margin:0;background:#060807;color:#f4f6f3;font-family:system-ui,sans-serif}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#060807;z-index:999;transition:opacity .25s ease}
  #boot.hidden{opacity:0;pointer-events:none}
  #boot .inner{text-align:center;opacity:.85}
  #boot .dot{width:10px;height:10px;border-radius:50%;background:#22c55e;
    display:inline-block;margin:0 3px;animation:p 1s infinite ease-in-out}
  #boot .dot:nth-child(2){animation-delay:.15s}
  #boot .dot:nth-child(3){animation-delay:.3s}
  @keyframes p{0%,80%,100%{opacity:.25}40%{opacity:1}}
  #boot p{margin-top:14px;font-size:13px;color:#9aa39c;direction:ltr;font-family:monospace}
  #bootErr{white-space:pre-wrap;text-align:left;direction:ltr;font-family:monospace;
    font-size:13px;color:#ff8a8a;max-width:720px;margin:16px auto 0;display:none}

  #stage-outer{min-height:100vh;display:flex;justify-content:center;background:#060807;
    padding:24px 12px}
  #stage{position:relative;width:100%;max-width:var(--rw,420px);background:#0a0c0a;
    border-radius:20px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
  #backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;
    pointer-events:none;transition:opacity .2s ease;z-index:40}
  #backdrop.show{opacity:1;pointer-events:auto}

  /* ---- تعيين عام (generic) لكل "نوع Strand" — لا يعرف شيئاً عن محتوى الصفحة ---- */
  .strand{position:absolute;box-sizing:border-box}
  .k-Text{white-space:pre-wrap;line-height:1.4}
  .k-Card{transition:transform .15s ease}
  .k-Button{display:flex;align-items:center;justify-content:center;cursor:pointer;
    user-select:none;border:none;font-family:inherit;transition:filter .15s ease,transform .1s ease}
  .k-Button:active{transform:scale(.97)}
  .k-MenuItem{display:flex;align-items:center;cursor:pointer;user-select:none;border-radius:8px}
  .k-MenuItem:hover{background:#141a15}
  .k-Divider{}
  .clickable{cursor:pointer}
  .clickable:hover{filter:brightness(1.12)}
  .k-Drawer{transition:left .25s cubic-bezier(.2,.8,.2,1);z-index:50}
  .k-TopBar{backdrop-filter:blur(10px);position:sticky;top:0;z-index:30}
</style>

<body>
  <noscript>
    <style>#boot,#stage-outer{display:none!important}</style>
    <main style="max-width:680px;margin:48px auto;padding:0 20px;line-height:1.9;font-family:system-ui,sans-serif">
      <h1>Rin — لغة برمجة صغيرة</h1>
      <p>Rin لغة برمجة بمحرّك C++17 واحد: Lexer وParser وInterpreter تعمل من سطر الأوامر، وفي IDE أندرويد (RinStudio)، وفي المتصفح عبر WebAssembly.
         Rin is a small programming language with a single C++17 engine for the command line, the Android IDE and the browser.</p>
      <h2>مكتبات Rin — Rin Libraries</h2>
      <p>مكتبات رسمية وحزم من المجتمع وإضافات: اعرض الكود، انسخه، حمّله، وشارك رابطاً مباشراً لأي مكتبة.
         Official and community libraries and extensions for Rin: browse, copy, download and share.</p>
      <ul>
        <li><a href="?view=libraries">تصفّح كل المكتبات / Browse all libraries</a></li>
        <li><a href="?@rin">المكتبات الرسمية / Official libraries (@rin)</a></li>
        <li><a href="sitemap.xml">خريطة الموقع / Sitemap</a></li>
      </ul>
      <p>يتطلّب عرض هذه الصفحة تفعيل JavaScript (محرّك Rin يعمل داخل المتصفح عبر WebAssembly).</p>
    </main>
  </noscript>
  <div id="boot">
    <div class="inner">
      <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <p id="bootMsg">loading rin engine (wasm)…</p>
      <pre id="bootErr"></pre>
    </div>
  </div>

  <div id="stage-outer">
    <div id="stage">
      <div id="backdrop"></div>
    </div>
  </div>

  <script src="rin.js"></script>
  <script src="libraries.js?v=7"></script>
  <script>
  (function () {
    var DESIGN_WIDTH = 420; // rootWidth: عرض التصميم الذي يخطّط عنده محرّك Indsin نفسه

    var bootEl = document.getElementById('boot');
    var bootMsg = document.getElementById('bootMsg');
    var bootErr = document.getElementById('bootErr');
    var stage = document.getElementById('stage');
    var backdrop = document.getElementById('backdrop');

    function fail(title, detail) {
      bootMsg.textContent = title;
      bootErr.textContent = detail || '';
      bootErr.style.display = 'block';
    }

    // ------------------------------------------------------------------
    // renderStrand: الدالة العامة الوحيدة التي تحوّل JSON إلى DOM. تتعامل
    // فقط مع "kind" و"attrs" العامة — لا تحتوي على أي كلمة أو رقم خاص
    // بمحتوى site.rin.
    // ------------------------------------------------------------------
    function renderFabric(root) {
      stage.querySelectorAll('.strand').forEach(function (n) { n.remove(); });
      stage.style.height = root.h + 'px';
      var frag = document.createDocumentFragment();
      walk(root, frag);
      stage.appendChild(frag);
    }

    function walk(node, container) {
      var el = buildElement(node);
      container.appendChild(el);
      // مهم: كل الأبناء يُلحَقون بنفس الحاوية المسطّحة (container)، لا بعنصر الأب
      // (el) — لأن كل .strand بترميز position:absolute، وx/y القادمتين من JSON
      // إحداثيات صفحة مطلقة (نفس نظام الإحداثيات الذي يحسبه محرّك Indsin نفسه،
      // انظر rin_indsin_layout.h). لو أُلحق الابن بعنصر الأب (الذي هو نفسه
      // position:absolute)، يصبح عنصر الأب "containing block" جديداً لأبنائه في
      // CSS، فيُضاف top/left الأب فوق top/left الابن المطلقين أصلاً — وكل مستوى
      // تعشيش إضافي يراكم هذا الخطأ. ترتيب الإلحاق (الأب أولاً ثم أبناؤه بعمق قبل
      // الانتقال للشقيق التالي) يبقى كما هو ليحافظ على ترتيب الرسم الصحيح (الخلفية
      // قبل محتواها) دون الحاجة لأي تعشيش DOM فعلي.
      for (var i = 0; i < node.children.length; i++) walk(node.children[i], container);
    }

    function buildElement(node) {
      var a = node.attrs || {};
      var el = document.createElement(node.kind === 'Button' ? 'button' : 'div');
      el.className = 'strand k-' + node.kind;
      if (node.name) el.id = node.name;
      el.style.left = node.x + 'px';
      el.style.top = node.y + 'px';
      el.style.width = node.w + 'px';
      el.style.height = node.h + 'px';

      // ---- سمات عامة يفهمها أي Strand من أي نوع ----
      if (a.bg) el.style.background = a.bg;
      if (a.gradient) {
        var parts = a.gradient.split(',');
        el.style.background = 'linear-gradient(135deg,' + parts.join(',') + ')';
      }
      if (a.radius) el.style.borderRadius = a.radius + 'px';
      if (a.color) el.style.color = a.color;
      if (a.weight) el.style.fontWeight = a.weight;
      if (a.size) el.style.fontSize = a.size + 'px';
      if (a.mono === 'true') el.style.fontFamily = "'JetBrains Mono', ui-monospace, Consolas, monospace";
      if (a.shadow) el.style.boxShadow = '0 10px 30px -12px rgba(0,0,0,.5)';

      // ---- نص العرض بحسب نوع الـ Strand ----
      if (node.kind === 'Text' || node.kind === 'MenuItem') el.textContent = a.text || a.label || '';
      if (node.kind === 'Button') el.textContent = a.label || '';

      // ---- تفاعل عام: أي Strand معه url أو onTap قابل للنقر ----
      var hasUrl = !!a.url;
      var hasTap = !!a.onTap;
      if (hasUrl || hasTap) {
        el.classList.add('clickable');
        el.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (a.copyText && navigator.clipboard) {
            navigator.clipboard.writeText(a.copyText).catch(function () {});
          }
          if (hasTap) dispatchTapAt(node.x + node.w / 2, node.y + node.h / 2);
          if (hasUrl) {
            if (a.url.charAt(0) === '?') {
              // رابط داخلي لمتجر المكتبات (libraries.js): نفس الصفحة، بلا HTML جديد
              if (window.RinStore && window.RinStore.navigate(a.url)) return;
              window.location.search = a.url;
            } else if (a.url.charAt(0) === '#') {
              var target = document.getElementById(a.url.slice(1));
              if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
              window.open(a.url, '_blank', 'noopener');
            }
          }
        });
      }

      // ---- Drawer: يُموضَع بحسب سمة open (خارج/داخل الشاشة)، ويعرض/يخفي الخلفية ----
      if (node.kind === 'Drawer') {
        var isOpen = node.x >= 0;
        backdrop.classList.toggle('show', isOpen);
      }

      return el;
    }

    backdrop.addEventListener('click', function () {
      var drawer = document.getElementById('mobileMenu');
      if (!drawer) return;
      var menuBtn = document.getElementById('menuBtn');
      if (menuBtn) {
        var r = menuBtn.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        dispatchTapAt(r.left - sr.left + r.width / 2, r.top - sr.top + r.height / 2);
      }
    });

    // ------------------------------------------------------------------
    var session = null;

    function dispatchTapAt(x, y) {
      if (!session) return;
      var json = Module.ccall('rin_indsin_session_tap', 'string',
        ['number', 'number', 'number'], [session, x, y]);
      applyFrame(json);
    }

    function applyFrame(jsonText) {
      var data;
      try { data = JSON.parse(jsonText); } catch (e) { fail('تعذّر قراءة ناتج المحرّك (JSON):', String(e)); return; }
      if (!data.ok) { fail('خطأ في site.rin:', (data.error || 'unknown') + (data.line ? ' (سطر ' + data.line + ')' : '')); return; }
      renderFabric(data.fabric);
    }

    var Module;
    (async function boot() {
      try {
        if (typeof RinModule !== 'function') {
          throw new Error('rin.js لم يُحمَّل بشكل صحيح (تأكد أن rin.js وrin.wasm منشوران بجانب هذا الملف).');
        }
        Module = await RinModule();

        bootMsg.textContent = 'fetching site.rin…';
        var res = await fetch('site.rin', { cache: 'no-store' });
        if (!res.ok) throw new Error('تعذّر جلب site.rin (HTTP ' + res.status + ')');
        var source = await res.text();

        bootMsg.textContent = 'building the @view Fabric via the official Indsintime engine…';
        session = Module.ccall('rin_indsin_session_create', 'number',
          ['string', 'number'], [source, DESIGN_WIDTH]);

        var json = Module.ccall('rin_indsin_session_render_json', 'string', ['number'], [session]);
        applyFrame(json);

        bootEl.classList.add('hidden');
      } catch (e) {
        console.error(e);
        fail('تعذّر تشغيل site.rin في المتصفح:', String(e && e.message ? e.message : e));
      }
    })();

    window.addEventListener('beforeunload', function () {
      if (session && Module) Module.ccall('rin_indsin_session_free', null, ['number'], [session]);
    });
  })();
  </script>
</body>
