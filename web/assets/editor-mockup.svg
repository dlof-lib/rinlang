  <rect x="46" y="112" width="714" height="24" fill="#141a15"/>

  <!-- code lines -->
  <g font-size="14">
    <text x="60" y="70"><tspan fill="#c586c0">@container</tspan><tspan fill="#cfd6cf">=</tspan><tspan fill="#4fc1ff">App</tspan></text>
    <text x="76" y="96"><tspan fill="#c586c0">state</tspan><tspan fill="#cfd6cf"> count = </tspan><tspan fill="#d19a66">0</tspan><tspan fill="#cfd6cf">;</tspan></text>
    <text x="76" y="122"><tspan fill="#cfd6cf">on init() { </tspan><tspan fill="#c586c0">print</tspan><tspan fill="#ce9178"> "جاهز";</tspan><tspan fill="#cfd6cf"> }</tspan></text>
    <text x="76" y="148"><tspan fill="#cfd6cf">fun inc() { count = count + </tspan><tspan fill="#d19a66">1</tspan><tspan fill="#cfd6cf">; }</tspan></text>
    <text x="60" y="174"><tspan fill="#cfd6cf">.end/container</tspan></text>
    <text x="60" y="226"><tspan fill="#c586c0">@element.button</tspan><tspan fill="#cfd6cf">=inc</tspan></text>
    <text x="76" y="252"><tspan fill="#cfd6cf">text = </tspan><tspan fill="#ce9178">"زيادة +1"</tspan><tspan fill="#cfd6cf">;</tspan></text>
    <text x="60" y="278"><tspan fill="#cfd6cf">.end/element</tspan></text>
  </g>
  <rect x="182" y="106" width="2" height="20" fill="#4ade80"/>

  <!-- Rin keyword panel row -->
  <rect x="46" y="402" width="714" height="58" fill="#0f140f"/>
