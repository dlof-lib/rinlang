<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIANO.PUO — معاينة حيّة</title>
<meta name="description" content="piano: مكتبة رسم متجهي احترافي لـ Rin — معاينة حيّة للمشاهد (.puo) والشيفرة.">
<link rel="icon" href="data:image/png;base64,__ICON32__">
<style>
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1b1b1b;--line:#2a2a2a;--fg:#f5f5f5;--mut:#a3a3a3;--g:#1db143;--g2:#1cb143;--err:#f87171;--r:12px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header img{width:40px;height:40px;border-radius:9px}
header h1{font-size:16px;margin:0;letter-spacing:.5px;font-weight:800}
header small{color:var(--mut);display:block;font-weight:400;letter-spacing:0}
.sp{flex:1}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.badge.ok{color:var(--g);border-color:#14532d}.badge.no{color:#fbbf24;border-color:#78350f}
button,select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover,select:hover{border-color:#3f3f3f}button.pri{background:var(--g);border-color:var(--g);color:#04210d;font-weight:700}
button.on{border-color:var(--g);color:var(--g)}button:disabled{opacity:.45;cursor:not-allowed}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:0}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:minmax(240px,40%) 1fr}}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane+.pane{border-inline-start:1px solid var(--line)}
@media(max-width:820px){.pane+.pane{border-inline-start:0;border-top:1px solid var(--line)}}
.bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px}.tabs button{border-radius:8px 8px 0 0}
textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:var(--panel);color:#e5e5e5;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;padding:12px;tab-size:4;direction:ltr;text-align:left;white-space:pre}
#err{display:none;padding:8px 12px;background:#2a1212;color:var(--err);font:12px ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;white-space:pre-wrap;border-top:1px solid #4c1d1d}
#err.show{display:block}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--panel)}
#stage.checker{background:conic-gradient(#1d1d1d 25%,#232323 0 50%,#1d1d1d 0 75%,#232323 0) 0 0/20px 20px}
#stage.light{background:#f5f5f5}#stage.black{background:#000}
#view{position:absolute;left:0;top:0;transform-origin:0 0}
#view svg{display:block;box-shadow:0 8px 30px #0008}
#gridov{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(#ffffff18 1px,transparent 1px),linear-gradient(90deg,#ffffff18 1px,transparent 1px);background-size:20px 20px}
#sel{position:absolute;pointer-events:none;border:2px solid var(--g);background:#1db14322;border-radius:3px;display:none}
#insp{max-height:34%;overflow:auto;border-top:1px solid var(--line);background:var(--panel);padding:8px 12px;font:12px ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;white-space:pre-wrap;color:#d4d4d4;display:none}
#insp.show{display:block}#insp b{color:var(--g)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#262626;border:1px solid var(--line);padding:8px 14px;border-radius:10px;display:none;z-index:9;max-width:90vw}
.zoom{margin-inline-start:auto;color:var(--mut);font-size:12px}
</style>

<body>
<header>
  <img alt="PIANO.PUO" src="data:image/png;base64,__ICON64__">
  <h1>PIANO.PUO<small>مكتبة رسم متجهي لـ Rin · معاينة حيّة · v__VERSION__</small></h1>
  <span class="sp"></span>
  <span id="engine" class="badge">محرك Rin: …</span>
  <select id="ex" aria-label="الأمثلة"></select>
</header>
<main>
  <section class="pane">
    <div class="bar">
      <div class="tabs"><button id="tRin" class="on">Rin</button><button id="tPuo" dir="ltr">.puo (JSON)</button></div>
      <span class="sp"></span>
      <button id="run" class="pri" title="Ctrl+Enter">▶ تشغيل</button>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div id="err"></div>
  </section>
  <section class="pane">
    <div class="bar">
      <button id="zo" title="تصغير">−</button><button id="zi" title="تكبير">+</button>
      <button id="fit">ملاءمة</button><button id="z100">100%</button>
      <button id="bgb" title="الخلفية">خلفية</button><button id="grb">شبكة</button><button id="inb">مفتّش</button>
      <span class="zoom" id="zl">100%</span>
    </div>
    <div id="stage" class="checker"><div id="view"></div><div id="gridov"></div><div id="sel"></div></div>
    <div id="player" class="bar" style="display:none"><button id="pp" title="تشغيل/إيقاف">⏸</button><input id="seek" type="range" min="0" max="0" value="0" style="flex:1"><span id="plab" class="zoom" style="margin:0">1/1</span></div>
    <div id="insp"></div>
    <div class="bar">
      <button id="eSvg">SVG</button><button id="ePng">PNG</button><button id="ePuo">.puo</button>
      <button id="cSvg">نسخ SVG</button><button id="cInd" title="وسم &lt;Image&gt; لواجهات indsin">وسم indsin</button><button id="link">رابط مشاركة</button>
    </div>
  </section>
</main>
<div id="toast"></div>
<script>/*piano.js*/
__PIANO_JS__
</script>
<script>
(function(){
'use strict';
var BUNDLE = __BUNDLE__;
var EXAMPLES = __EXAMPLES__;
var BUNDLE_LINES = BUNDLE.split('\n').length + 1;
var $ = function(id){return document.getElementById(id)};
var code=$('code'), errEl=$('err'), view=$('view'), stage=$('stage'), insp=$('insp'), sel=$('sel');
var mode='puo', scene=null, svgText='', tz={s:1,x:0,y:0}, userZoom=false, inspect=false, Module=null, dirtyRin=false;
var rinText='', puoText='';

function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2600)}
function showErr(m){errEl.textContent=m||'';errEl.classList.toggle('show',!!m)}

/* ---------- العرض ---------- */
function apply(){view.style.transform='translate('+tz.x+'px,'+tz.y+'px) scale('+tz.s+')';$('zl').textContent=Math.round(tz.s*100)+'%';updSel()}
function fit(){
  if(!scene) return;var r=stage.getBoundingClientRect(),m=24;
  var s=Math.min((r.width-m*2)/scene.w,(r.height-m*2)/scene.h);s=Math.max(.05,Math.min(s,4));
  tz={s:s,x:(r.width-scene.w*s)/2,y:(r.height-scene.h*s)/2};userZoom=false;apply();
}
/* ---------- تشغيل الحركة (anim) ---------- */
var anim=null, fullScene=null, fi=0, playing=false, t0=0, raf=0;
function compose(i){var f=anim.frames[i],c=fullScene,o={piano:1,w:c.w,h:c.h,bg:c.bg===undefined?'none':c.bg,font:c.font,defs:f.defs,nodes:f.nodes};
  if(c.title)o.title=c.title;if(c.dw){o.dw=c.dw;o.dh=c.dh}return o}
function frameTo(i){fi=i;scene=compose(i);svgText=Piano.render(scene);view.innerHTML=Piano.render(scene,{inspect:true});
  $('seek').value=i;$('plab').textContent=(i+1)+'/'+anim.frames.length+' · '+anim.fps+'fps'}
function tick(ts){if(!playing)return;if(!t0)t0=ts-fi*1000/anim.fps;var n=anim.frames.length,idx=Math.floor((ts-t0)/1000*anim.fps);
  if(anim.loop===false&&idx>=n){frameTo(n-1);pauseAnim();return}
  idx=idx%n;if(idx!==fi)frameTo(idx);raf=requestAnimationFrame(tick)}
function playAnim(){if(!anim)return;playing=true;t0=0;$('pp').textContent='⏸';cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
function pauseAnim(){playing=false;cancelAnimationFrame(raf);$('pp').textContent='▶'}
function stopAnim(){pauseAnim();anim=null;fullScene=null;$('player').style.display='none'}
$('pp').onclick=function(){playing?pauseAnim():playAnim()};
$('seek').oninput=function(){pauseAnim();frameTo(+this.value)};
function show(sc){
  var keep=playing;stopAnim();
  if(sc.anim&&sc.anim.frames&&sc.anim.frames.length>1){
    fullScene=sc;anim=sc.anim;$('player').style.display='flex';$('seek').max=anim.frames.length-1;
    frameTo(0);if(!userZoom)fit();else apply();clearSel();playAnim();return}
  scene=sc;
  svgText=Piano.render(sc);
  view.innerHTML=Piano.render(sc,{inspect:true});
  if(!userZoom) fit(); else apply();
  clearSel();
}
function parsePuo(t){return JSON.parse(t)}
function livePuo(){
  try{show(parsePuo(code.value));showErr('')}
  catch(e){
    var m=String(e.message||e), p=/position (\d+)/.exec(m);
    if(p){var ln=code.value.slice(0,+p[1]).split('\n').length;m='سطر '+ln+': '+m}
    showErr(m)
  }
}

/* ---------- كتل piano.<الاسم> { … }; — نفس تحويل المحرّك (rin_lexer.cpp) ---------- */
function skipLit(s,i){var n=s.length,c=s[i];
  if(c==='/'&&s[i+1]==='/'){while(i<n&&s[i]!=='\n')i++;return i}
  if(c==='/'&&s[i+1]==='*'){i+=2;while(i+1<n&&!(s[i]==='*'&&s[i+1]==='/'))i++;return Math.min(i+2,n)}
  if(c==='"'||c==="'"||c==='`'){var q=c;i++;while(i<n&&s[i]!==q){if(s[i]==='\\')i++;i++}return Math.min(i+1,n)}
  return i}
function newComment(s,i,mode){var n=s.length;
  function close(from,cl,multi){for(var k=from;k<n;k++){if(s[k]==='\n'){if(!multi)return k;continue}if(s.substr(k,cl.length)===cl)return k+cl.length}
    var k2=from;while(k2<n&&s[k2]!=='\n')k2++;return k2}
  if(s.substr(i,3)==='*//')return close(i+3,'//*',true);
  if(s.substr(i,2)==='//')return close(i+2,'//',false);
  if(s[i]==='+'&&s[i+1]==='+')return close(i+2,'++',true);
  return i}
function isId(ch){return /[A-Za-z0-9_]/.test(ch)||ch.charCodeAt(0)>=128}
function expandPiano(s){
  if(s.indexOf('piano.')<0)return s;
  var out='',i=0,n=s.length,lastSig='';
  while(i<n){
    var j=skipLit(s,i);if(j!==i){var cm=s[i]==='/';out+=s.slice(i,j);if(!cm)lastSig='"';i=j;continue}
    if(s.substr(i,6)==='piano.'&&(i===0||(!isId(s[i-1])&&s[i-1]!=='.'))){
      var stmt=lastSig===''||lastSig===';'||lastSig==='{'||lastSig==='}';
      var k=i+6,ns=k;while(k<n&&isId(s[k]))k++;
      var name=s.slice(ns,k),m=k;while(m<n&&/\s/.test(s[m]))m++;
      var varsMap='';
      if(stmt&&name&&s[m]==='('){
        var dp=0,pe=m;
        for(;pe<n;pe++){var s2=skipLit(s,pe);if(s2!==pe){pe=s2-1;continue}
          if('([{'.indexOf(s[pe])>=0)dp++;else if(')]}'.indexOf(s[pe])>=0){if(--dp===0)break}}
        var aft=pe+1;while(aft<n&&/\s/.test(s[aft]))aft++;
        if(pe<n&&s[aft]==='{'){
          var inner=s.slice(m+1,pe).replace(/[\r\n]/g,' '),items=[],cur='',d=0;
          for(var x=0;x<inner.length;x++){var s3=skipLit(inner,x);if(s3!==x){cur+=inner.slice(x,s3);x=s3-1;continue}
            var ch=inner[x];if('([{'.indexOf(ch)>=0)d++;else if(')]}'.indexOf(ch)>=0)d--;
            if(ch===','&&d===0){items.push(cur);cur=''}else cur+=ch}
          if(cur)items.push(cur);
          var ok=true,parts=[];
          items.forEach(function(it){if(!ok)return;var ex=it.trim(),key,eq=-1,d2=0;
            for(var y=0;y<ex.length;y++){var s4=skipLit(ex,y);if(s4!==y){y=s4-1;continue}
              var c2=ex[y];if('([{'.indexOf(c2)>=0)d2++;else if(')]}'.indexOf(c2)>=0)d2--;
              else if(c2==='='&&d2===0&&ex[y+1]!=='='&&(y===0||'=!<>'.indexOf(ex[y-1])<0)){eq=y;break}}
            if(eq>=0){key=ex.slice(0,eq).trim();ex=ex.slice(eq+1).trim()}else key=ex;
            if(!key||!ex||/[0-9]/.test(key[0])||/[^A-Za-z0-9_\u0080-\uffff]/.test(key)){ok=false;return}
            parts.push('"'+key+'": '+ex)});
          if(ok){varsMap='{'+parts.join(', ')+'}';m=aft}}}
      if(stmt&&name&&!/[0-9]/.test(name[0])&&s[m]==='{'){
        var depth=0,e=m;
        for(;e<n;e++){var sk=newComment(s,e,2);if(sk===e)sk=skipLit(s,e);if(sk!==e){e=sk-1;continue}
          if(s[e]==='{')depth++;else if(s[e]==='}'){if(--depth===0)break}}
        if(e<n){
          var body=s.slice(m+1,e).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r/g,'').replace(/\n/g,'\\n').replace(/\t/g,'\\t');
          var after=e+1,q=after;while(q<n&&(s[q]===' '||s[q]==='\t'))q++;if(s[q]===';')after=q+1;
          var nl=(s.slice(i,after).match(/\n/g)||[]).length,line0=(s.slice(0,m).match(/\n/g)||[]).length+1;
          out+=varsMap?'let '+name+' = pn_dsl_with("'+name+'", "'+body+'", '+line0+', '+varsMap+');'+'\n'.repeat(nl):'let '+name+' = pn_dsl_at("'+name+'", "'+body+'", '+line0+');'+'\n'.repeat(nl);
          lastSig=';';i=after;continue}}}
    if(!/\s/.test(s[i]))lastSig=s[i];out+=s[i++]}
  return out}

/* ---------- محرك Rin (WASM) ---------- */
function loadEngine(){
  var tries=['./rin.js','../rin.js'], i=0;
  (function next(){
    if(i>=tries.length){engineState(false);return}
    var s=document.createElement('script');s.src=tries[i++];
    s.onload=function(){
      if(typeof RinModule!=='function'){next();return}
      RinModule().then(function(m){Module=m;engineState(true)}).catch(function(){engineState(false)});
    };
    s.onerror=next;document.head.appendChild(s);
  })();
}
function engineState(ok){
  var b=$('engine');b.className='badge '+(ok?'ok':'no');
  b.textContent=ok?'محرك Rin: جاهز ✓':'محرك Rin: غير متاح — وضع .puo فقط';
  $('run').disabled=!ok&&mode==='rin'&&dirtyRin;
}
function runRin(){
  if(!Module){
    if(dirtyRin){showErr('محرك Rin (WASM) غير متاح في هذه الصفحة — يتوفر على موقع Pages بعد النشر. استعمل تبويب .puo للمعاينة الفورية.');}
    return;
  }
  var user=code.value, mm=/(^|[;{}\s])piano\.([A-Za-z_\u0080-\uffff][\w\u0080-\uffff]*)\s*\{/.exec(user), target=mm?mm[2]:'c';
  var src=BUNDLE+'\n'+expandPiano(user)+'\ntry { print "@@PUO@@"; print pn_json('+target+'); } catch (e) { }\n';
  var out;
  try{out=Module.ccall('rin_run_source','string',['string'],[src])}catch(e){showErr('خطأ في المحرك: '+e);return}
  if(out.indexOf('__RIN_ERROR__:')===0){
    var m=/^__RIN_ERROR__:(\d+):([\s\S]*)$/.exec(out);
    showErr('Rin — سطر '+Math.max(1,(+m[1])-BUNDLE_LINES)+': '+m[2]);return;
  }
  var k=out.indexOf('@@PUO@@\n');
  if(k<0){showErr('لم يُنتج البرنامج مشهداً: عرّف لوحة باسم c (let c = pn_canvas(w, h);) أو اكتب piano.الاسم { … };');return}
  try{var sc=parsePuo(out.slice(k+8));puoText=out.slice(k+8).trim();show(sc);showErr('')}catch(e){showErr(String(e))}
}

/* ---------- الأمثلة والتبويبات ---------- */
function setMode(m){
  if(mode==='rin') rinText=code.value; else puoText=code.value;
  mode=m;$('tRin').classList.toggle('on',m==='rin');$('tPuo').classList.toggle('on',m==='puo');
  code.value=m==='rin'?rinText:puoText;$('run').style.display=m==='rin'?'':'none';
  showErr('');if(m==='puo')livePuo();else if(Module&&dirtyRin)runRin();else{try{show(parsePuo(puoText))}catch(e){}}
  engineState(!!Module);
}
function loadExample(i){
  var e=EXAMPLES[i];rinText=e.rin;puoText=e.puo;dirtyRin=false;userZoom=false;
  code.value=mode==='rin'?rinText:puoText;
  try{show(parsePuo(puoText));showErr('')}catch(x){showErr(String(x))}
  engineState(!!Module);
}
EXAMPLES.forEach(function(e,i){var o=document.createElement('option');o.value=i;o.textContent=e.title;$('ex').appendChild(o)});
$('ex').onchange=function(){loadExample(+this.value)};
$('tRin').onclick=function(){setMode('rin')};$('tPuo').onclick=function(){setMode('puo')};
$('run').onclick=function(){dirtyRin=true;runRin()};
var deb;
code.addEventListener('input',function(){
  clearTimeout(deb);
  if(mode==='puo'){deb=setTimeout(livePuo,120)}
  else{dirtyRin=true;engineState(!!Module);if(Module)deb=setTimeout(runRin,600)}
});
code.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('run').onclick()}
  if(e.key==='Tab'){e.preventDefault();var s=code.selectionStart;code.setRangeText('    ',s,code.selectionEnd,'end');code.dispatchEvent(new Event('input'))}
});

/* ---------- تكبير وسحب ---------- */
var drag=null;
stage.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,tx:tz.x,ty:tz.y,moved:false};stage.setPointerCapture(e.pointerId);stage.style.cursor='grabbing'});
stage.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;tz.x=drag.tx+dx;tz.y=drag.ty+dy;userZoom=true;apply()});
stage.addEventListener('pointerup',function(e){stage.style.cursor='grab';var d=drag;drag=null;if(d&&!d.moved&&inspect)pick(e)});
function zoomAt(f,cx,cy){var r=stage.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,ns=Math.max(.05,Math.min(tz.s*f,20));tz.x=px-(px-tz.x)*ns/tz.s;tz.y=py-(py-tz.y)*ns/tz.s;tz.s=ns;userZoom=true;apply()}
stage.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});
function zc(f){var r=stage.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)}
$('zi').onclick=function(){zc(1.25)};$('zo').onclick=function(){zc(.8)};$('fit').onclick=fit;
$('z100').onclick=function(){var r=stage.getBoundingClientRect();tz={s:1,x:(r.width-scene.w)/2,y:(r.height-scene.h)/2};userZoom=true;apply()};
window.addEventListener('resize',function(){if(!userZoom)fit()});
var bgs=['checker','light','black'],bi=0;
$('bgb').onclick=function(){stage.classList.remove(bgs[bi]);bi=(bi+1)%3;stage.classList.add(bgs[bi])};
$('grb').onclick=function(){var g=$('gridov');var on=g.style.display!=='block';g.style.display=on?'block':'none';this.classList.toggle('on',on)};

/* ---------- المفتّش ---------- */
function nodeAt(path){var n={nodes:scene.nodes},p=path.split('.');for(var i=0;i<p.length;i++){n=n.nodes[+p[i]]}return n}
function clearSel(){sel.style.display='none';insp.textContent='';}
function updSel(){if(sel._el&&sel.style.display==='block')place(sel._el)}
function place(el){var a=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  sel.style.display='block';sel.style.left=(a.left-s.left-2)+'px';sel.style.top=(a.top-s.top-2)+'px';sel.style.width=(a.width+4)+'px';sel.style.height=(a.height+4)+'px'}
function pick(e){
  if(playing)pauseAnim();
  var el=document.elementFromPoint(e.clientX,e.clientY);while(el&&el!==view&&!(el.getAttribute&&el.getAttribute('data-pn')))el=el.parentNode;
  if(!el||el===view){clearSel();return}
  sel._el=el;place(el);var path=el.getAttribute('data-pn'),n=nodeAt(path);
  insp.innerHTML='<b>'+path+'</b>  '+esc(JSON.stringify(n,null,2));
}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
$('inb').onclick=function(){inspect=!inspect;this.classList.toggle('on',inspect);insp.classList.toggle('show',inspect);stage.style.cursor=inspect?'crosshair':'grab';if(!inspect)clearSel();else insp.innerHTML='انقر عنصراً في اللوحة لعرض عقدته.'};

/* ---------- التصدير ---------- */
function dl(name,blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
$('eSvg').onclick=function(){if(scene)dl('piano.svg',new Blob([(fullScene?Piano.renderAnim(fullScene):svgText)+'\n'],{type:'image/svg+xml'}))};
$('ePuo').onclick=function(){if(scene)dl('piano.puo',new Blob([JSON.stringify(fullScene||scene,null,fullScene?0:2)+'\n'],{type:'application/json'}))};
$('cSvg').onclick=function(){if(!scene)return;(navigator.clipboard?navigator.clipboard.writeText(fullScene?Piano.renderAnim(fullScene):svgText):Promise.reject()).then(function(){toast('نُسخ SVG')},function(){toast('تعذّر النسخ')})};
$('cInd').onclick=function(){
  if(!scene)return;var w=scene.dw||scene.w,h=scene.dh||scene.h;
  var tag='<Image#art src="data:image/svg+xml;base64,'+b64(svgText)+'" width='+Math.round(w)+' height='+Math.round(h)+' />';
  (navigator.clipboard?navigator.clipboard.writeText(tag):Promise.reject()).then(function(){toast('نُسخ وسم indsin ('+tag.length+' حرفاً)')},function(){toast('تعذّر النسخ')})
};
$('ePng').onclick=function(){
  if(!scene)return;var img=new Image(),sc=2;
  img.onload=function(){var c=document.createElement('canvas');c.width=scene.w*sc;c.height=scene.h*sc;var x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){dl('piano.png',b)},'image/png')};
  img.onerror=function(){toast('تعذّر تصدير PNG')};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgText);
};
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
$('link').onclick=function(){
  if(!scene)return;if(fullScene){toast('الرابط لا يدعم المشاهد المتحركة — صدّر .puo');return}var h='#s='+b64(JSON.stringify(scene));location.hash=h;
  (navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(function(){toast('نُسخ الرابط')},function(){toast('الرابط في شريط العنوان')});
};

/* ---------- البدء ---------- */
loadEngine();
setTimeout(function(){if(!Module)engineState(false)},2500);
loadExample(0);
$('run').style.display='none';
var m=/^#s=(.+)$/.exec(location.hash);
if(m){try{puoText=decodeURIComponent(escape(atob(m[1])));code.value=puoText;livePuo()}catch(e){}}
})();
</script>
</body>
</html>
