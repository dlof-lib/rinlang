# مطلوب لأن dependencies المشروع (androidx.core, androidx.appcompat, إلخ) تنتمي لعائلة
# AndroidX — بدون هذا العلم يفشل AGP بخطأ "contains AndroidX dependencies, but the
# android.useAndroidX property is not enabled".
android.useAndroidX=true

# يمنع تحويل نفس الكلاسات مرتين لو كانت أي مكتبة تبعية قديمة تستخدم مكتبات android.support.*
# القديمة بدل AndroidX — غير ضار حتى لو لم تكن هناك حاجة فعلية له حالياً.
android.enableJetifier=true

org.gradle.jvmargs=-Xmx2048m
