plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services' version '4.5.0'
}

android {
    namespace 'com.dlof.gety'
    compileSdk 34

    defaultConfig {
        applicationId "com.dlof.gety"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("RIN_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("RIN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RIN_KEY_ALIAS")
                keyPassword System.getenv("RIN_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // يُطبَّق فقط إذا كانت متغيرات البيئة موجودة فعلياً (أثناء بناء الـ CI)، وإلا يبقى
            // الإصدار release غير موقَّع محلياً عند البناء اليدوي بدون هذه المتغيرات.
            if (System.getenv("RIN_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // مسح رمز QR بالكاميرا (مكتبة جاهزة وموثوقة، تغلّف zxing وتدير صلاحية الكاميرا تلقائياً).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    // لا حاجة لـ Firebase SDK من أجل GETY نفسه (يتواصل عبر REST المباشر عبر
    // FirebaseRestClient.kt)، لكنها مطلوبة لأن com.dlof.rinlang.auth.* (المرحلة 1)
    // لا يزال مصدرها ضمن هذه الوحدة نفسها، ويستدعي FirebaseAuth وFirebaseDatabase
    // مباشرة — بدونها يفشل compileReleaseKotlin بخطأ "unresolved reference: firebase".
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-database-ktx'
}
