plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dlof.wgom'
    compileSdk 34

    defaultConfig {
        applicationId "com.dlof.wgom"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // لا حاجة لـ Firebase SDK هنا أيضاً: WGOM يستخدم REST المباشر لكل من Firebase
    // Authentication (Identity Toolkit) و Realtime Database — راجع AuthRestClient.kt
    // و RtdbRestClient.kt — بنفس أسلوب EmailJsSender.kt في RinStudio، فلا يحتاج
    // تسجيل تطبيق منفصل ولا ملف google-services.json خاص به.
}
