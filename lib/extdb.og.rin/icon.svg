      <stop offset="0.7" stop-color="#16A3A0"/>
      <stop offset="1" stop-color="#0B6D79"/>
    </linearGradient>
    <linearGradient id="sideShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#04323F" stop-opacity="0"/>
      <stop offset="1" stop-color="#04323F" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FFFD"/>
      <stop offset="1" stop-color="#9AF3E8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F5EA"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020619" flood-opacity=".45"/>
    </filter>
    <clipPath id="tileClip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

