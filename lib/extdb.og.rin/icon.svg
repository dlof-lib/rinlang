<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="extdb">
  <title>extdb — external databases for Rin</title>
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2B3FA0"/>
      <stop offset="0.5" stop-color="#16246B"/>
      <stop offset="1" stop-color="#080F33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#45E0D0" stop-opacity=".38"/>
      <stop offset="0.6" stop-color="#45E0D0" stop-opacity=".08"/>
      <stop offset="1" stop-color="#45E0D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
